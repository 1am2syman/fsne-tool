[project]
name = "fsne-tool"
version = "0.1.0"
description = "Vectorized Polars translations of Excel Power Query pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.38,<2",
    "fastexcel>=0.16,<1",
    "openpyxl>=3.1,<4",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
fsne-queries = "src.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
